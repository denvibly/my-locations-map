<html lang="ru">
<head>
  <meta charset="UTF-8">

  <style>
    :root {
      --ink: #10212b;
      --muted: #6c7c84;
      --line: #dce7ea;
      --accent: #0f766e;
      --accent-dark: #0b5f59;
      --soft: #eef8f5;
      --danger: #b42318;
      --panel: rgba(255, 255, 255, 0.94);
      --shadow: 0 8px 20px rgba(15, 23, 42, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
    }

    body {
      margin: 0;
      overflow: hidden;
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: linear-gradient(135deg, #eef8f5, #f8fbff 55%, #eef2ff);
    }

    button,
    input {
      font: inherit;
    }

    button:focus-visible,
    input:focus-visible,
    a:focus-visible,
    [tabindex]:focus-visible {
      outline: 3px solid #8bd1c2;
      outline-offset: 2px;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .app {
      display: grid;
      grid-template-columns: 360px minmax(0, 1fr);
      height: 100vh;
      height: 100dvh;
    }

    aside {
      position: relative;
      z-index: 5;
      padding: 22px;
      overflow: auto;
      overscroll-behavior: contain;
      background: rgba(255, 255, 255, 0.88);
      border-right: 1px solid rgba(255, 255, 255, 0.7);
      box-shadow: 10px 0 26px rgba(15, 23, 42, 0.1);
      backdrop-filter: blur(12px);
    }

    .search-wrap {
      position: relative;
    }

    .search {
      width: 100%;
      padding: 13px 14px;
      color: var(--ink);
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 12px;
      outline: none;
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.05);
    }

    .search:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px #d8f0eb;
    }

    .suggestions {
      display: none;
      position: absolute;
      z-index: 50;
      top: calc(100% + 5px);
      left: 0;
      right: 0;
      max-height: 280px;
      overflow: auto;
      padding: 5px;
      background: #fff;
      border: 1px solid #b8d8d0;
      border-radius: 10px;
      box-shadow: 0 12px 28px rgba(21, 59, 56, 0.18);
    }

    .suggestions.visible {
      display: block;
    }

    .suggestion {
      display: block;
      width: 100%;
      padding: 9px 10px;
      color: var(--ink);
      text-align: left;
      background: transparent;
      border: 0;
      border-radius: 7px;
      cursor: pointer;
      font-size: 13px;
    }

    .suggestion:hover,
    .suggestion.active {
      color: var(--accent);
      background: var(--soft);
    }

    .top-actions {
      display: flex;
      gap: 8px;
      margin: 8px 0 14px;
    }

    .primary-button,
    .secondary-button,
    .add-route,
    .show-more {
      border: 0;
      border-radius: 9px;
      cursor: pointer;
      font-weight: 750;
    }

    .primary-button {
      min-height: 38px;
      padding: 9px 13px;
      color: #fff;
      background: var(--accent);
    }

    .primary-button:hover {
      background: var(--accent-dark);
    }

    .primary-button:disabled {
      cursor: wait;
      opacity: 0.62;
    }

    .filters-title {
      margin: 0 0 8px;
      font-size: 16px;
      font-weight: 800;
    }

    .filters {
      display: grid;
      gap: 8px;
      min-height: 292px;
    }

    .filter-skeleton {
      height: 42px;
      border-radius: 10px;
      background: linear-gradient(90deg, #edf3f4 25%, #f7fafa 45%, #edf3f4 65%);
      background-size: 200% 100%;
      animation: shimmer 1.25s linear infinite;
    }

    @keyframes shimmer {
      to {
        background-position: -200% 0;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .filter-skeleton {
        animation: none;
      }
    }

    .filter-menu {
      position: relative;
    }

    .filter-button {
      width: 100%;
      min-height: 42px;
      padding: 9px 12px;
      color: var(--ink);
      text-align: left;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 10px;
      cursor: pointer;
      box-shadow: 0 3px 10px rgba(15, 23, 42, 0.04);
    }

    .filter-button.selected {
      color: var(--accent);
      font-weight: 750;
      background: #e5f6f1;
      border-color: #7fc8b8;
    }

    .filter-button::after {
      content: "?";
      float: right;
      color: var(--muted);
    }

    .filter-menu.open .filter-button::after {
      content: "?";
    }

    .filter-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-top: 5px;
    }

    .filter-tag {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      max-width: 100%;
      padding: 3px 7px;
      color: var(--accent-dark);
      background: #ccece5;
      border: 0;
      border-radius: 999px;
      cursor: pointer;
      font-size: 11px;
    }

    .filter-tag span {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .filter-tag b {
      font-size: 14px;
      line-height: 1;
    }

    .filter-panel {
      display: none;
      position: absolute;
      z-index: 40;
      top: calc(100% + 5px);
      left: 0;
      right: 0;
      max-height: 250px;
      overflow: auto;
      padding: 6px;
      background: #fff;
      border: 1px solid #cfe0e4;
      border-radius: 10px;
      box-shadow: 0 18px 38px rgba(15, 23, 42, 0.18);
    }

    .filter-menu.open .filter-panel {
      display: block;
    }

    .filter-search {
      position: sticky;
      z-index: 1;
      top: 0;
      width: 100%;
      margin-bottom: 5px;
      padding: 8px 9px;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 7px;
    }

    .filter-option {
      display: flex;
      gap: 8px;
      align-items: center;
      padding: 8px;
      border-radius: 7px;
      cursor: pointer;
      font-size: 13px;
    }

    .filter-option:hover {
      background: var(--soft);
    }

    .filter-option input,
    .location-toggle input {
      accent-color: var(--accent);
    }

    .location-toggles {
      display: grid;
      gap: 8px;
      margin-top: 11px;
      padding-top: 11px;
      border-top: 1px solid var(--line);
    }

    .location-toggle {
      display: flex;
      gap: 9px;
      align-items: center;
      padding: 8px 10px;
      background: #f7faf9;
      border-radius: 9px;
      cursor: pointer;
      font-size: 13px;
    }

    .location-toggle input {
      width: 17px;
      height: 17px;
    }

    .route {
      margin-top: 18px;
      padding-top: 16px;
      border-top: 1px solid var(--line);
    }

    .route h3 {
      margin: 0 0 9px;
      font-size: 14px;
    }

    .route-point-row {
      display: flex;
      gap: 6px;
      align-items: flex-start;
    }

    .route-input-wrap {
      position: relative;
      flex: 1;
      min-width: 0;
    }

    .route-point {
      width: 100%;
      margin-bottom: 7px;
      padding: 9px 10px;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 9px;
      cursor: grab;
    }

    .route-point:active {
      cursor: grabbing;
    }

    .route-point.dragging {
      opacity: 0.55;
    }

    .route-suggestions {
      display: none;
      position: absolute;
      z-index: 45;
      top: 39px;
      left: 0;
      right: 0;
      max-height: 220px;
      overflow: auto;
      padding: 4px;
      background: #fff;
      border: 1px solid #b8d8d0;
      border-radius: 9px;
      box-shadow: var(--shadow);
    }

    .route-suggestions.visible {
      display: block;
    }

    .route-suggestion {
      display: block;
      width: 100%;
      padding: 8px;
      color: var(--ink);
      text-align: left;
      background: transparent;
      border: 0;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
    }

    .route-suggestion:hover {
      color: var(--accent);
      background: var(--soft);
    }

    .route-remove {
      flex: 0 0 36px;
      width: 36px;
      height: 36px;
      padding: 0;
      color: var(--muted);
      background: #f1f4f4;
      border: 0;
      border-radius: 9px;
      cursor: pointer;
      font-size: 22px;
      line-height: 1;
    }

    .route-remove:hover {
      color: var(--danger);
      background: #fde8e7;
    }

    .add-route {
      width: 100%;
      margin: 2px 0 8px;
      padding: 8px;
      color: var(--accent);
      background: #f0faf7;
      border: 1px dashed #9bcfc3;
    }

    .route-actions {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 7px;
      margin-top: 7px;
    }

    .route-actions button {
      min-width: 0;
    }

    .secondary-button {
      min-height: 38px;
      padding: 8px;
      color: var(--accent);
      background: #eaf2f0;
    }

    .route-result {
      min-height: 34px;
      margin-top: 9px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.4;
    }

    .summary {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin: 20px 0 10px;
      color: var(--muted);
      font-size: 13px;
    }

    .badge {
      flex: 0 0 auto;
      padding: 5px 9px;
      color: var(--accent);
      background: var(--soft);
      border-radius: 999px;
      font-weight: 750;
    }

    .places {
      display: grid;
      gap: 9px;
    }

    .place {
      padding: 13px;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 13px;
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.05);
      cursor: pointer;
      content-visibility: auto;
      contain-intrinsic-size: 112px;
      transition: transform 0.15s ease, border-color 0.15s ease, background-color 0.15s ease;
    }

    .place:hover,
    .place.active {
      background: var(--soft);
      border-color: #9bd7ca;
      transform: translateY(-1px);
    }

    .place h2 {
      margin: 0 0 5px;
      font-size: 15px;
    }

    .place p {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.42;
    }

    .place a {
      color: var(--accent);
    }

    .empty {
      padding: 18px 4px;
      color: var(--muted);
      font-size: 14px;
    }

    .show-more {
      display: none;
      width: 100%;
      margin-top: 10px;
      padding: 10px;
      color: var(--accent);
      background: #eaf5f2;
    }

    .show-more.visible {
      display: block;
    }

    .data-note {
      margin-top: 14px;
      color: var(--muted);
      font-size: 11px;
    }

    .map-shell {
      position: relative;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      background: #e8eef0;
    }

    #map {
      width: 100%;
      height: 100%;
    }

    .map-message {
      position: absolute;
      z-index: 3;
      top: 16px;
      left: 50%;
      max-width: min(520px, calc(100% - 32px));
      padding: 10px 14px;
      color: var(--ink);
      text-align: center;
      background: rgba(255, 255, 255, 0.96);
      border: 1px solid var(--line);
      border-radius: 10px;
      box-shadow: var(--shadow);
      transform: translateX(-50%);
      font-size: 13px;
    }

    .map-message.hidden {
      display: none;
    }

    .legend {
      position: absolute;
      z-index: 2;
      right: 0;
      bottom: 0;
      left: 0;
      display: flex;
      justify-content: center;
      gap: 16px;
      padding: 8px 14px;
      overflow: auto;
      color: var(--muted);
      background: rgba(255, 255, 255, 0.94);
      border-top: 1px solid var(--line);
      box-shadow: 0 -3px 12px rgba(21, 59, 56, 0.06);
      font-size: 12px;
      scrollbar-width: thin;
    }

    .legend span {
      white-space: nowrap;
    }

    .legend b {
      color: var(--ink);
    }

    .legend-icon {
      display: inline-block;
      width: 12px;
      height: 12px;
      margin-right: 4px;
      border: 2px solid #fff;
      border-radius: 50% 50% 50% 0;
      box-shadow: 0 0 0 1px #84949a;
      transform: rotate(-45deg);
      vertical-align: -2px;
    }

    .legend-red { background: #ef3f35; }
    .legend-blue { background: #2563eb; }
    .legend-yellow { background: #f2b01e; }
    .legend-black { background: #111827; }
    .legend-lime { background: #9bdc28; }

    .map-pin {
      position: relative;
      width: 23px;
      height: 23px;
      background: var(--pin-color, #ef3f35);
      border: 2px solid #fff;
      border-radius: 50% 50% 50% 0;
      box-shadow: 0 2px 6px rgba(15, 23, 42, 0.35);
      transform: rotate(-45deg);
      transform-origin: 50% 100%;
      transition: transform 0.12s ease;
    }

    .map-pin::after {
      content: "";
      position: absolute;
      top: 6px;
      left: 6px;
      width: 7px;
      height: 7px;
      background: #fff;
      border-radius: 50%;
    }

    .map-pin.highlighted {
      transform: rotate(-45deg) scale(1.35);
    }

    .map-pin.hotel {
      --pin-color: #7c3aed;
      border-radius: 50%;
      transform: none;
    }

    .map-pin.hotel.highlighted {
      transform: scale(1.25);
    }

    @media (max-width: 760px) {
      .app {
        grid-template-columns: 1fr;
        grid-template-rows: 44dvh 56dvh;
      }

      aside {
        order: 2;
        padding: 18px;
        border-top: 1px solid var(--line);
        border-right: 0;
        backdrop-filter: none;
      }

      .map-shell {
        order: 1;
      }

      .legend {
        justify-content: flex-start;
        gap: 8px;
        font-size: 10px;
      }
    }
  </style>
</head>

    let currentVisibleMarkerIndexes = new Set();
    let activeSearchSuggestion = -1;

    function debounce(fn, delay) {
      let timer = null;
      return function () {
        const args = arguments;
        clearTimeout(timer);
        timer = setTimeout(function () {
          fn.apply(null, args);
        }, delay);
      };
    }

    function nextFrame() {
      return new Promise(function (resolve) {
        requestAnimationFrame(resolve);
      });
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, function (character) {
        return {
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          "\"": "&quot;",
          "'": "&#039;"
        }[character];
      });
    }

    function normalizeText(value) {
      return String(value || "")
        .toLowerCase()
        .replace(/?/g, "?")
        .replace(/\s+/g, " ")
        .trim();
    }

    function normalizeHeader(header) {
      return normalizeText(header).replace(/[^a-z?-?0-9]/g, "");
    }

    function safeHttpUrl(value, fallback) {
      try {
        const url = new URL(String(value || ""), window.location.href);
        if (url.protocol === "https:" || url.protocol === "http:") {
          return url.href;
        }
      } catch (error) {
        // Use fallback below.
      }
      return fallback;
    }

    function pluralizeLocations(count) {
      const mod10 = count % 10;
      const mod100 = count % 100;
      if (mod10 === 1 && mod100 !== 11) return "???????";
      if (mod10 >= 2 && mod10 <= 4 && (mod100 < 12 || mod100 > 14)) return "???????";
      return "???????";
    }

    function parseCsv(text) {
      const cleaned = String(text || "").replace(/\r\n/g, "\n").replace(/\r/g, "\n");
      const rows = [];
      const expression = /("(?:[^"]|"")*"|[^,\n]*)(,|\n|$)/g;
      let row = [];
      let match;

      while ((match = expression.exec(cleaned))) {
        let value = match[1];
        if (value.startsWith("\"") && value.endsWith("\"")) {
          value = value.slice(1, -1).replace(/""/g, "\"");
        }
        row.push(value.trim());

        if (match[2] === "\n") {
          rows.push(row);
          row = [];
        }

        if (!match[2]) break;
      }

      if (row.length && row.some(Boolean)) rows.push(row);
      return rows;
    }

    function locationsFromRows(rows) {
      if (rows.length < 2) return [];

      const headers = rows[0].map(normalizeHeader);
      const exact = function (name) {
        return headers.findIndex(function (header) {
          return header === name;
        });
      };
      const find = function (names) {
        return headers.findIndex(function (header) {
          return names.some(function (name) {
            return header.includes(name);
          });
        });
      };
      const preferExact = function (exactName, includeNames, fallbackIndex) {
        const exactIndex = exact(exactName);
        if (exactIndex >= 0) return exactIndex;
        const foundIndex = find(includeNames);
        if (foundIndex >= 0) return foundIndex;
        return headers.length > fallbackIndex ? fallbackIndex : -1;
      };

      const indexes = {
        name: find(["name", "????????", "???????", "?????", "link"]),
        project: find(["project"]),
        lat: find(["lat", "??????"]),
        lng: find(["lng", "lon", "???????"]),
        note: find(["note", "description", "??????????", "????????"]),
        address: find(["address", "?????"]),
        status: preferExact("status", ["status", "??????"], 20),
        cxStatus: preferExact("cxstatus", ["cxstatus"], 21),
        active: preferExact("active", ["active"], 23),
        maps: find(["googlemaps", "maps"]),
        start: preferExact("start", ["start"], 25),
        locationType: find(["locationtype", "??????????"]),
        crewLead: find(["crewlead", "???????????????????"]),
        marketState: find(["marketcarrierstates", "market", "carrierstates", "????"])
      };

      const valueAt = function (row, index) {
        return index >= 0 ? String(row[index] || "").trim() : "";
      };

      return rows.slice(1).map(function (row, rowIndex) {
        const name = valueAt(row, indexes.name) || valueAt(row, indexes.project) || "??? ????????";
        const lat = Number(valueAt(row, indexes.lat).replace(",", "."));
        const lng = Number(valueAt(row, indexes.lng).replace(",", "."));
        const address = valueAt(row, indexes.address);
        const fallbackMapUrl = "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(lat + "," + lng);
        const mapsLink = safeHttpUrl(valueAt(row, indexes.maps), fallbackMapUrl);
        const details = [
          valueAt(row, indexes.project),
          address,
          valueAt(row, indexes.status),
          valueAt(row, indexes.active),
          valueAt(row, indexes.note)
        ].filter(Boolean);

        return {
          name: name,
          lat: lat,
          lng: lng,
          note: details.join(" • "),
          address: address,
          mapsLink: mapsLink,
          hasAddress: Boolean(address),
          sheetRow: rowIndex + 2,
          status: valueAt(row, indexes.status),
          cxStatus: valueAt(row, indexes.cxStatus),
          active: valueAt(row, indexes.active),
          locationType: valueAt(row, indexes.locationType),
          crewLead: valueAt(row, indexes.crewLead),
          marketState: valueAt(row, indexes.marketState),
          project: valueAt(row, indexes.project),
          start: valueAt(row, indexes.start)
        };
      }).filter(function (location) {
        return Number.isFinite(location.lat) &&
          Number.isFinite(location.lng) &&
          location.hasAddress;
      });
    }

    function readCachedLocations() {
      try {
        const cached = JSON.parse(localStorage.getItem(CONFIG.cacheKey) || "null");
        if (!cached || !Array.isArray(cached.data) || !cached.data.length) return null;
        if (Date.now() - Number(cached.savedAt || 0) > CONFIG.cacheMaxAgeMs) return null;
        return cached.data;
      } catch (error) {
        return null;
      }
    }

    function writeCachedLocations(data) {
      try {
        localStorage.setItem(CONFIG.cacheKey, JSON.stringify({
          savedAt: Date.now(),
          data: data
        }));
      } catch (error) {
        // Cache is an optional acceleration only.
      }
    }

      const response = await fetch(CONFIG.sheetCsvUrl, { cache: "no-store" });
      if (!response.ok) {
        throw new Error("?? ??????? ????????? ???????: HTTP " + response.status);
      }
      const parsed = locationsFromRows(parseCsv(await response.text()));
      if (!parsed.length) {
        throw new Error("? ??????? ?? ??????? ?????????? ???????");
      }
      return parsed;
    }

    function fingerprintLocations(data) {
      return JSON.stringify(data.map(function (location) {
        return [
          location.name,
          location.lat,
          location.lng,
          location.note,
          location.address,
          location.mapsLink,
          location.status,
          location.cxStatus,
          location.active,
          location.locationType,
          location.crewLead,
          location.marketState,
          location.project,
          location.start
        ];
      }));
    }

    function prepareLocations(data) {
      return data.map(function (location, index) {
        return Object.assign({}, location, {
          index: index,
          normalizedName: normalizeText(location.name),
          searchText: normalizeText([
            location.name,
            location.note,
            location.address,
            location.marketState,
            location.crewLead,
            location.project
          ].join(" "))
        });
      });
    }

    function applyLocations(data, sourceLabel) {
      const nextFingerprint = fingerprintLocations(data);
      if (nextFingerprint === locationsFingerprint) {
        elements.status.textContent = locations.length + " " + pluralizeLocations(locations.length);
        return;
      }

      locationsFingerprint = nextFingerprint;
      locations = prepareLocations(data);
      visibleLimit = CONFIG.pageSize;
      rebuildFilterData();
      setupFilters();
      updateRouteSelectionsAfterDataChange();
      applyFiltersAndRender();
      rebuildMarkers();

      elements.status.textContent = locations.length + " " + pluralizeLocations(locations.length) +
        (sourceLabel === "cache" ? " · ??????????? ??????" : "");
    }

    async function loadLocationData() {
      const cached = readCachedLocations();
      if (cached) {
        applyLocations(cached, "cache");
      }

      try {
        const fresh = await fetchFreshLocations();
        writeCachedLocations(fresh);
        applyLocations(fresh, "fresh");
      } catch (error) {

          applyLocations(FALLBACK_LOCATIONS, "fallback");

    function rebuildFilterData() {
      FILTER_FIELDS.forEach(function (field) {
        const values = Array.from(new Set(locations.map(function (location) {
          return location[field.key];
        }).filter(Boolean))).sort(function (a, b) {
          return a.localeCompare(b);
        });

        filterOptions[field.key] = values;
        selectedFilters[field.key] = selectedFilters[field.key] || new Set();

        Array.from(selectedFilters[field.key]).forEach(function (selected) {
          if (!values.includes(selected)) selectedFilters[field.key].delete(selected);
        });
      });
    }

    function buildFilterOptions(key) {
      const panel = elements.filters.querySelector('[data-filter-panel="' + CSS.escape(key) + '"]');
      if (!panel || panel.dataset.built === "true") return;

      const container = panel.querySelector('[data-filter-options="' + CSS.escape(key) + '"]');
      const fragment = document.createDocumentFragment();

      filterOptions[key].forEach(function (value) {
        const label = document.createElement("label");
        label.className = "filter-option";

        const input = document.createElement("input");
        input.type = "checkbox";
        input.dataset.filterValue = key;
        input.value = value;
        input.checked = selectedFilters[key].has(value);

        const span = document.createElement("span");
        span.textContent = value;

        label.append(input, span);
        fragment.appendChild(label);
      });

      container.appendChild(fragment);
      panel.dataset.built = "true";
    }

    function updateFilterPresentation(key) {
      const field = FILTER_FIELDS.find(function (item) {
        return item.key === key;

      const button = elements.filters.querySelector('[data-filter-button="' + CSS.escape(key) + '"]');
      const tags = elements.filters.querySelector('[data-filter-tags="' + CSS.escape(key) + '"]');

      const button = event.target.closest("[data-filter-button]");
      if (button) {
        const menu = button.closest(".filter-menu");
        const willOpen = !menu.classList.contains("open");
        closeFilterMenus(menu);
        menu.classList.toggle("open", willOpen);
        button.setAttribute("aria-expanded", String(willOpen));
        if (willOpen) {
          buildFilterOptions(button.dataset.filterButton);
          const search = menu.querySelector("[data-filter-search]");
          if (search) requestAnimationFrame(function () { search.focus(); });
        }
        return;
      }

      const remove = event.target.closest("[data-remove-filter]");
      if (remove) {
        event.stopPropagation();
        const key = remove.dataset.removeFilter;
        const value = remove.dataset.removeValue;
        selectedFilters[key].delete(value);

        const checkbox = Array.from(elements.filters.querySelectorAll('[data-filter-value="' + CSS.escape(key) + '"]')).find(function (input) {
          return input.value === value;
        });
        if (checkbox) checkbox.checked = false;

        updateFilterPresentation(key);
        visibleLimit = CONFIG.pageSize;
        applyFiltersAndRender();
      }
    });

      if (input.checked) selectedFilters[key].add(input.value);

    function calculateFilteredIndexes() {
      const query = normalizeText(elements.search.value);

      const result = [];
      locations.forEach(function (location, index) {
        if (query && !location.searchText.includes(query)) return;
        if (activeOnly && !isActiveLocation(location)) return;
        if (!locationMatchesSelectedFilters(location)) return;
        result.push(index);
      });
      return result;
    }

      const matches = [];

      if (!suggestions.length) return;

      if (event.key === "ArrowDown") {
        event.preventDefault();
        activeSearchSuggestion = (activeSearchSuggestion + 1) % suggestions.length;
      } else if (event.key === "ArrowUp") {
        event.preventDefault();
        activeSearchSuggestion = (activeSearchSuggestion - 1 + suggestions.length) % suggestions.length;
      } else if (event.key === "Enter" && activeSearchSuggestion >= 0) {
        event.preventDefault();
        selectSearchSuggestion(Number(suggestions[activeSearchSuggestion].dataset.suggestionIndex));
        return;
      } else if (event.key === "Escape") {
        closeSearchSuggestions();
        return;
      } else {
        return;
      }

      suggestions.forEach(function (suggestion, index) {
        suggestion.classList.toggle("active", index === activeSearchSuggestion);

    function resolveRouteInput(input) {
      const storedIndex = Number(input.dataset.locationIndex);
      if (Number.isInteger(storedIndex) && locations[storedIndex] && locations[storedIndex].name === input.value.trim()) {
        return storedIndex;
      }

      const normalized = normalizeText(input.value);
      const exactIndex = locations.findIndex(function (location) {
        return location.normalizedName === normalized;
      });

      if (exactIndex >= 0) input.dataset.locationIndex = String(exactIndex);
      else delete input.dataset.locationIndex;
      return exactIndex;
    }

    function getRouteIds() {
      return Array.from(elements.routePoints.querySelectorAll("[data-route-point]")).map(resolveRouteInput).filter(function (index) {
        return index >= 0;
      });
    }

    function refreshRouteSelection(focusedInput) {
      routeSelection = new Set(getRouteIds());
      const highlighted = focusedInput ? resolveRouteInput(focusedInput) : -1;
      setHighlightedMarker(highlighted);
      updateMarkerVisibility();
    }

    function updateRouteSelectionsAfterDataChange() {
      elements.routePoints.querySelectorAll("[data-route-point]").forEach(function (input) {
        delete input.dataset.locationIndex;
        resolveRouteInput(input);
      });
      refreshRouteSelection(null);
    }

    elements.addRoutePoint.addEventListener("click", function () {
      const nextNumber = elements.routePoints.querySelectorAll("[data-route-row]").length + 1;
      elements.routePoints.appendChild(createRouteRow(nextNumber));
      const input = elements.routePoints.querySelector("[data-route-row]:last-child [data-route-point]");
      input.focus();
      renderRouteSuggestions(input);
    });

    elements.routePoints.addEventListener("click", function (event) {
      const suggestion = event.target.closest("[data-route-suggestion-index]");
      if (suggestion) {
        const index = Number(suggestion.dataset.routeSuggestionIndex);
        const row = suggestion.closest("[data-route-row]");
        const input = row.querySelector("[data-route-point]");
        input.value = locations[index].name;
        input.dataset.locationIndex = String(index);
        closeRouteSuggestions();
        refreshRouteSelection(input);
        return;
      }

      const clear = event.target.closest(".clear-route-point");
      if (clear) {
        const input = clear.closest("[data-route-row]").querySelector("[data-route-point]");
        input.value = "";
        delete input.dataset.locationIndex;
        refreshRouteSelection(input);
        input.focus();
        return;
      }

      const remove = event.target.closest(".remove-route-point");
      if (remove) {
        remove.closest("[data-route-row]").remove();
        renumberRouteRows();
        refreshRouteSelection(null);
      }
    });

    elements.routePoints.addEventListener("input", function (event) {
      const input = event.target.closest("[data-route-point]");
      if (!input) return;
      delete input.dataset.locationIndex;
      resolveRouteInput(input);
      renderRouteSuggestions(input);
      refreshRouteSelection(input);
    });

    elements.routePoints.addEventListener("focusin", function (event) {
      const input = event.target.closest("[data-route-point]");
      if (!input) return;
      renderRouteSuggestions(input);
      refreshRouteSelection(input);
    });

    elements.routePoints.addEventListener("dragstart", function (event) {
      const input = event.target.closest("[data-route-point]");
      if (!input) return;
      event.dataTransfer.setData("text/plain", input.dataset.routePoint);
      input.classList.add("dragging");
    });

    elements.routePoints.addEventListener("dragend", function (event) {
      const input = event.target.closest("[data-route-point]");
      if (input) input.classList.remove("dragging");
    });

    elements.routePoints.addEventListener("dragover", function (event) {
      if (event.target.closest("[data-route-point]")) event.preventDefault();
    });

    elements.routePoints.addEventListener("drop", function (event) {
      const target = event.target.closest("[data-route-point]");
      if (!target) return;
      event.preventDefault();

      const sourceNumber = event.dataTransfer.getData("text/plain");
      const source = elements.routePoints.querySelector('[data-route-point="' + CSS.escape(sourceNumber) + '"]');
      if (!source || source === target) return;

      const sourceValue = source.value;
      const sourceIndex = source.dataset.locationIndex;
      source.value = target.value;
      target.value = sourceValue;

      if (target.dataset.locationIndex) source.dataset.locationIndex = target.dataset.locationIndex;
      else delete source.dataset.locationIndex;

      if (sourceIndex) target.dataset.locationIndex = sourceIndex;
      else delete target.dataset.locationIndex;

      refreshRouteSelection(target);
    });

    function openRouteInGoogleMaps() {
      const ids = getRouteIds();
      if (ids.length < 2) {
        elements.routeResult.textContent = "???????? ??????? 2 ?????.";
        return;
      }

      const points = ids.map(function (index) {
        return locations[index].lat + "," + locations[index].lng;
      });
      const routeUrl = "https://www.google.com/maps/dir/" + points.join("/");
      window.open(routeUrl, "_blank", "noopener");
    }

    async function buildRouteOnMap() {
      const ids = getRouteIds();
      if (ids.length < 2) {
        elements.routeResult.textContent = "???????? ??????? 2 ?????.";
        return;
      }
      if (!map || !window.google || !google.maps) {
        elements.routeResult.textContent = "????? ??? ???????????.";
        return;
      }

      elements.buildRoute.disabled = true;
      elements.routeResult.textContent = "?????? ???????…";

      try {
        if (!directionsService) {
          directionsService = new google.maps.DirectionsService();
          directionsRenderer = new google.maps.DirectionsRenderer({
            map: map,
            suppressMarkers: false
          });
        }

        const point = function (index) {
          return {
            lat: locations[index].lat,
            lng: locations[index].lng
          };
        };

        const result = await directionsService.route({
          origin: point(ids[0]),
          destination: point(ids[ids.length - 1]),
          waypoints: ids.slice(1, -1).map(function (index) {
            return {
              location: point(index),
              stopover: true
            };
          }),
          travelMode: google.maps.TravelMode.DRIVING,
          optimizeWaypoints: false
        });

        directionsRenderer.setDirections(result);
        elements.routeResult.textContent = "??????? ???????? ?? ?????.";
      } catch (error) {
        console.error(error);
        elements.routeResult.textContent = "?? ??????? ????????? ???????: " + (error.message || error);
      } finally {
        elements.buildRoute.disabled = false;
      }
    }

    elements.openRoute.addEventListener("click", openRouteInGoogleMaps);
    elements.buildRoute.addEventListener("click", buildRouteOnMap);

    function markerColor(location) {
      const status = normalizeText(location.status);
      const cxStatus = normalizeText(location.cxStatus);
      const active = isActiveLocation(location);
      const completed = status.includes("completed");
      const isWarehouse = String(location.locationType || "").trim().toUpperCase() === "WH";

      if (cxStatus.includes("not started")) return "#111827";
      if (status && !completed) return "#f2b01e";
      if (active && !isWarehouse) return "#9bdc28";
      if (isWarehouse) return "#2563eb";
      return "#ef3f35";
    }

    function legacyMarkerIcon(location, highlighted) {
      return {
        path: "M0-48c-10 0-18 8-18 18 0 13 18 30 18 30s18-17 18-30c0-10-8-18-18-18z",
        fillColor: markerColor(location),
        fillOpacity: 1,
        strokeColor: "#ffffff",
        strokeWeight: 2,
        scale: highlighted ? 1.05 : 0.75,
        anchor: new google.maps.Point(0, 0)
      };
    }

    function createPinElement(location, extraClass) {
      const pin = document.createElement("div");
      pin.className = "map-pin" + (extraClass ? " " + extraClass : "");
      pin.style.setProperty("--pin-color", markerColor(location));
      pin.setAttribute("aria-hidden", "true");
      return pin;
    }

    async function loadExternalScript(src, globalTest) {
      if (globalTest()) return;

      await new Promise(function (resolve, reject) {
        const existing = document.querySelector('script[data-src="' + CSS.escape(src) + '"]');
        if (existing) {
          existing.addEventListener("load", resolve, { once: true });
          existing.addEventListener("error", reject, { once: true });
          return;
        }

        const script = document.createElement("script");
        script.src = src;
        script.async = true;
        script.dataset.src = src;
        script.onload = resolve;
        script.onerror = function () {
          reject(new Error("?? ??????? ????????? " + src));
        };
        document.head.appendChild(script);
      });
    }

    function ensureMarkerClusterer() {
      if (!markerClustererPromise) {
        markerClustererPromise = loadExternalScript(CONFIG.markerClustererUrl, function () {
          return Boolean(window.markerClusterer && window.markerClusterer.MarkerClusterer);
        }).catch(function (error) {
          console.warn("MarkerClusterer ??????????, ?????????? ??????? ???????.", error);
        });
      }
      return markerClustererPromise;
    }

    async function ensureMarkerClass() {
      if (advancedMarkerClass || !window.google || !google.maps) return;

      try {
        const markerLibrary = await google.maps.importLibrary("marker");
        advancedMarkerClass = markerLibrary.AdvancedMarkerElement;
        usingAdvancedMarkers = Boolean(advancedMarkerClass);
      } catch (error) {
        usingAdvancedMarkers = false;
        console.warn("AdvancedMarkerElement ??????????, ?????????? ??????????? ??????.", error);
      }
    }

    function removeMarkerFromMap(marker) {
      if (!marker) return;
      if ("map" in marker) marker.map = null;
      else if (typeof marker.setMap === "function") marker.setMap(null);
    }

    function clearLocationMarkers() {
      if (markerCluster) {
        try {
          markerCluster.clearMarkers();
          markerCluster.setMap(null);
        } catch (error) {
          console.warn(error);
        }
        markerCluster = null;
      }

      markers.forEach(removeMarkerFromMap);
      markers = [];
    }

    function createLocationMarker(location, index) {
      let marker;

      if (usingAdvancedMarkers) {
        const content = createPinElement(location, "");
        marker = new advancedMarkerClass({
          position: { lat: location.lat, lng: location.lng },
          title: location.crewLead ? location.name + " — " + location.crewLead : location.name,
          content: content,
          gmpClickable: true
        });
        marker.__pinElement = content;
      } else {
        marker = new google.maps.Marker({
          position: { lat: location.lat, lng: location.lng },
          title: location.crewLead ? location.name + " — " + location.crewLead : location.name,
          icon: legacyMarkerIcon(location, false),
          optimized: true
        });
      }

      marker.__locationIndex = index;
      marker.addListener("click", function () {
        focusLocation(index);
      });
      return marker;
    }

    async function rebuildMarkers() {
      if (!map || !locations.length || !window.google || !google.maps) return;

      const buildToken = ++markerBuildToken;
      clearLocationMarkers();

      await Promise.all([
        ensureMarkerClass(),
        ensureMarkerClusterer()
      ]);

      if (buildToken !== markerBuildToken) return;
      markers = new Array(locations.length);

      const chunkSize = 60;
      for (let start = 0; start < locations.length; start += chunkSize) {
        if (buildToken !== markerBuildToken) return;

        const end = Math.min(start + chunkSize, locations.length);
        for (let index = start; index < end; index += 1) {
          markers[index] = createLocationMarker(locations[index], index);
        }
        await nextFrame();
      }

      if (buildToken !== markerBuildToken) return;

      const bounds = new google.maps.LatLngBounds();
      locations.forEach(function (location) {
        bounds.extend({ lat: location.lat, lng: location.lng });
      });

      if (!bounds.isEmpty()) map.fitBounds(bounds, 54);
      updateMarkerVisibility();
    }

    function updateMarkerVisibility() {
      if (!map || !markers.length) return;

      const nextVisible = new Set(filteredIndexes);
      routeSelection.forEach(function (index) {
        nextVisible.add(index);
      });
      currentVisibleMarkerIndexes = nextVisible;

      const visibleMarkers = Array.from(nextVisible).map(function (index) {
        return markers[index];
      }).filter(Boolean);

      if (window.markerClusterer && window.markerClusterer.MarkerClusterer) {
        if (!markerCluster) {
          markerCluster = new window.markerClusterer.MarkerClusterer({
            map: map,
            markers: visibleMarkers
          });
        } else {
          markerCluster.clearMarkers(true);
          markerCluster.addMarkers(visibleMarkers, true);
          markerCluster.render();
        }
      } else {
        markers.forEach(function (marker, index) {
          const shouldShow = nextVisible.has(index);
          if ("map" in marker) marker.map = shouldShow ? map : null;
          else marker.setMap(shouldShow ? map : null);
        });
      }
    }

    function setHighlightedMarker(index) {
      if (highlightedMarkerIndex === index) return;

      const updateOne = function (markerIndex, highlighted) {
        const marker = markers[markerIndex];
        const location = locations[markerIndex];
        if (!marker || !location) return;

        if (marker.__pinElement) {
          marker.__pinElement.classList.toggle("highlighted", highlighted);
          marker.zIndex = highlighted ? 1000 : null;
        } else if (typeof marker.setIcon === "function") {
          marker.setIcon(legacyMarkerIcon(location, highlighted));
          marker.setZIndex(highlighted ? 1000 : undefined);
        }
      };

      if (highlightedMarkerIndex >= 0) updateOne(highlightedMarkerIndex, false);
      highlightedMarkerIndex = index;
      if (highlightedMarkerIndex >= 0) updateOne(highlightedMarkerIndex, true);
    }

    function infoWindowHtml(location) {
      const lines = [
        "<strong>" + escapeHtml(location.name) + "</strong>",
        location.address ? "<br><b>Address:</b> " + escapeHtml(location.address) : "",
        location.marketState ? "<br><b>Market/Carrier States:</b> " + escapeHtml(location.marketState) : "",
        location.cxStatus ? "<br><b>CX Status:</b> " + escapeHtml(location.cxStatus) : "",
        location.status ? "<br><b>Status:</b> " + escapeHtml(location.status) : "",
        location.crewLead ? "<br><b>Crew Lead:</b> " + escapeHtml(location.crewLead) : "",
        '<br><a href="' + escapeHtml(location.mapsLink) + '" target="_blank" rel="noopener noreferrer">??????? ? Google Maps</a>'
      ];
      return '<div style="line-height:1.5">' + lines.join("") + "</div>";
    }

    function focusLocation(index) {
      const location = locations[index];
      const marker = markers[index];
      if (!location) return;

      setHighlightedMarker(index);
      elements.places.querySelectorAll("[data-index]").forEach(function (card) {
        card.classList.toggle("active", Number(card.dataset.index) === index);
      });

      if (!map || !marker || !infoWindow) return;

      map.panTo({ lat: location.lat, lng: location.lng });
      if ((map.getZoom() || 0) < 8) map.setZoom(8);
      infoWindow.setContent(infoWindowHtml(location));

      try {
        infoWindow.open({ map: map, anchor: marker });
      } catch (error) {
        infoWindow.open(map, marker);
      }
    }

    async function initializeBaseMap() {
      const mapsLibrary = await google.maps.importLibrary("maps");
      map = new mapsLibrary.Map(document.getElementById("map"), {
        center: { lat: 38.5, lng: -90.0 },
        zoom: 4,
        mapId: CONFIG.googleMapId || "DEMO_MAP_ID",
        clickableIcons: false,
        gestureHandling: "greedy",
        streetViewControl: false
      });
      infoWindow = new google.maps.InfoWindow();
      elements.mapMessage.classList.add("hidden");

      if (locations.length) rebuildMarkers();
    }

    function loadGoogleMaps() {
      return new Promise(function (resolve, reject) {
        if (!CONFIG.googleMapsApiKey || CONFIG.googleMapsApiKey.includes("PASTE_")) {
          reject(new Error("???????? Google Maps API key ? CONFIG.googleMapsApiKey"));
          return;
        }

        window.__locationsMapGoogleReady = function () {
          resolve();
          delete window.__locationsMapGoogleReady;
        };

        const script = document.createElement("script");
        script.src = "https://maps.googleapis.com/maps/api/js?key=" +
          encodeURIComponent(CONFIG.googleMapsApiKey) +
          "&callback=__locationsMapGoogleReady&loading=async&v=weekly";
        script.async = true;
        script.onerror = function () {
          reject(new Error("Google Maps API ?? ??????????"));
        };
        document.head.appendChild(script);
      });
    }

    async function startMap() {
      try {
        await loadGoogleMaps();
        await initializeBaseMap();
      } catch (error) {
        if (!String(error.message || error).includes("???????? Google Maps API key")) {
          console.error(error);
        }
        elements.mapMessage.textContent = error.message || "????? ?? ???????????";
        elements.mapMessage.classList.remove("hidden");
      }
    }

    window.gm_authFailure = function () {
      elements.mapMessage.textContent = "Google ???????? API key. ????????? API, billing ? HTTP referrer.";
      elements.mapMessage.classList.remove("hidden");
    };

    function clearHotelMarkers() {
      hotelMarkers.forEach(removeMarkerFromMap);
      hotelMarkers = [];
    }

    async function findHotels() {
      const query = normalizeText(elements.search.value);
      if (!query) {
        elements.status.textContent = "??????? ???????? ??????? ? ??????";
        return;
      }

      const location = locations.find(function (item) {
        return item.normalizedName === query;
      }) || locations.find(function (item) {
        return item.normalizedName.includes(query);
      });

      if (!location) {
        elements.status.textContent = "??????? ???????? ??????? ? ??????";
        return;
      }
      if (!map || !window.google || !google.maps) {
        elements.status.textContent = "????? ??? ???????????";
        return;
      }

      clearHotelMarkers();
      elements.findHotel.disabled = true;
      elements.status.textContent = "????? ?????? ?????…";

      try {
        const placesLibrary = await google.maps.importLibrary("places");
        const result = await placesLibrary.Place.searchNearby({
          fields: ["displayName", "location", "formattedAddress", "googleMapsURI", "rating"],
          includedPrimaryTypes: ["hotel"],
          maxResultCount: 20,
          rankPreference: "DISTANCE",
          locationRestriction: {
            center: { lat: location.lat, lng: location.lng },
            radius: 10000
          }
        });

        const places = result.places || [];
        places.forEach(function (place) {
          let marker;

          if (usingAdvancedMarkers && advancedMarkerClass) {
            const pin = document.createElement("div");
            pin.className = "map-pin hotel";
            marker = new advancedMarkerClass({
              map: map,
              position: place.location,
              title: place.displayName || "Hotel",
              content: pin,
              gmpClickable: true
            });
          } else {
            marker = new google.maps.Marker({
              map: map,
              position: place.location,
              title: place.displayName || "Hotel",
              icon: {
                path: google.maps.SymbolPath.CIRCLE,
                scale: 8,
                fillColor: "#7c3aed",
                fillOpacity: 1,
                strokeColor: "#ffffff",
                strokeWeight: 2
              }
            });
          }

          marker.addListener("click", function () {
            const link = place.googleMapsURI
              ? '<br><a href="' + escapeHtml(safeHttpUrl(place.googleMapsURI, "#")) + '" target="_blank" rel="noopener noreferrer">Open in Google Maps</a>'
              : "";
            const content =
              "<strong>" + escapeHtml(place.displayName || "Hotel") + "</strong>" +
              (place.formattedAddress ? "<br>" + escapeHtml(place.formattedAddress) : "") +
              (place.rating ? "<br>Rating: " + escapeHtml(place.rating) : "") +
              link;
            infoWindow.setContent(content);
            try {
              infoWindow.open({ map: map, anchor: marker });
            } catch (error) {
              infoWindow.open(map, marker);
            }
          });

          hotelMarkers.push(marker);
        });

        map.panTo({ lat: location.lat, lng: location.lng });
        map.setZoom(11);
        elements.status.textContent = places.length + " hotels found nearby";
      } catch (error) {
        console.error(error);
        elements.status.textContent = "?????? ?????? ??????: " + (error.message || "??????????? ??????");
      } finally {
        elements.findHotel.disabled = false;
      }
    }

    elements.findHotel.addEventListener("click", findHotels);

    /*
      ????? ? ??????? ??????????? ????????????.
      ??? ????????? ???????? ?????? ????? ??? ????????? ????????.
    */
    startMap();
    loadLocationData();
  </script>
