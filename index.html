<body>

  <script>
    // Замените два значения ниже на свои данные.
    const CONFIG = {
      googleMapsApiKey: 'AIzaSyCg5M_iG5gLdOgNH9baLh707ihpYPpjTOQ',
      sheetCsvUrl: 'https://docs.google.com/spreadsheets/d/1lVcZV4bHwlVEJVNOXTv2WStc6QXfCPocy71v8YSM9C0/export?format=csv&gid=1292317977'
    };

    const fallbackLocations = [
      { name: 'Пример локации', lat: 55.751244, lng: 37.618423, note: 'Замените данные в Google Sheets' }
    ];
    let map, infoWindow, directionsService, directionsRenderer, locationLabels, markers = [], hotelMarkers = [], locations = [], routeSelection = new Set(), highlightedRouteIndex = -1;

    function createLocationLabelsOverlay(mapInstance, items) { class LocationLabelsOverlay extends google.maps.OverlayView {
      constructor(mapInstance, items) { super(); this.mapInstance = mapInstance; this.items = items; this.enabled = false; this.visibleIndexes = []; this.nodes = new Map(); this.setMap(mapInstance); }

      onRemove() { this.layer?.remove(); this.nodes.clear(); }
      setEnabled(enabled) { this.enabled = enabled; if (this.layer) this.layer.style.display = enabled ? 'block' : 'none'; this.draw(); }
      setVisibleIndexes(indexes) { this.visibleIndexes = indexes; this.draw(); }
      draw() {
        if (!this.layer || !this.enabled) return;
        const projection = this.getProjection(); if (!projection) return;
        const activeIndexes = new Set(this.visibleIndexes);
        this.nodes.forEach((node, index) => { if (!activeIndexes.has(index)) { node.remove(); this.nodes.delete(index); } });
        const placed = [];
        const overlapArea = (first, second) => Math.max(0, Math.min(first.right, second.right) - Math.max(first.left, second.left)) * Math.max(0, Math.min(first.bottom, second.bottom) - Math.max(first.top, second.top));

          const location = this.items[index]; if (!location) return;

          if (!node) { node = document.createElement('div'); node.className = 'map-location-label'; node.textContent = location.name; this.layer.appendChild(node); this.nodes.set(index, node); }
          const pixel = projection.fromLatLngToDivPixel(new google.maps.LatLng(location.lat, location.lng));

          let closestPlacement;
          let smallestOverlap = Infinity;

            const angle = attempt * 2.399963229728653;
            const radius = attempt === 0 ? 8 : 14 + Math.sqrt(attempt) * 12;
            const x = pixel.x + Math.cos(angle) * radius;
            const y = pixel.y - 8 + Math.sin(angle) * radius;
            const rect = { left:x - width / 2, right:x + width / 2, top:y - height, bottom:y };
            const overlap = placed.reduce((total, other) => total + overlapArea(rect, other), 0);

          if (!placement) placement = closestPlacement || { x:pixel.x, y:pixel.y - 8, rect:{ left:pixel.x - width / 2, right:pixel.x + width / 2, top:pixel.y - 8 - height, bottom:pixel.y - 8 } };

    function parseCsv(text) {
      const rows = [], re = /("(?:[^"]|"")*"|[^,\n]*)(,|\n|$)/g; let row = [], match;

const nameI = find(['name','название','локация','место','link']), projectI = find(['project']), latI = find(['lat','широта']), lngI = find(['lng','lon','долгота']), noteI = find(['note','description','примечание','описание']), addressI = find(['address','адрес']), statusI = headers.length > 20 ? 20 : (exact('status') >= 0 ? exact('status') : find(['status','статус'])), cxStatusI = exact('cxstatus') >= 0 ? exact('cxstatus') : find(['cxstatus']), activeI = headers.length > 23 ? 23 : find(['active']), mapsI = find(['googlemaps','maps']), customI = headers.length > 24 ? 24 : (exact('custom') >= 0 ? exact('custom') : find(['custom'])), startI = headers.length > 25 ? 25 : (exact('start') >= 0 ? exact('start') : find(['start'])), weekI = headers.length > 26 ? 26 : (exact('week') >= 0 ? exact('week') : find(['week']));

        const sheetRow = rowIndex + 2;
        const name = row[nameI >= 0 ? nameI : 0] || row[projectI >= 0 ? projectI : 0] || 'Без названия';
        const details = [projectI >= 0 && row[projectI], addressI >= 0 && row[addressI], statusI >= 0 && row[statusI], activeI >= 0 && row[activeI], noteI >= 0 && row[noteI]].filter(Boolean);
        const value = index => index >= 0 ? String(row[index] || '').trim() : '';
        const address = value(addressI), mapsLink = value(mapsI) || `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(`${row[latI]},${row[lngI]}`)}`;
        return { name, lat: Number(String(row[latI >= 0 ? latI : 1]).replace(',', '.')), lng: Number(String(row[lngI >= 0 ? lngI : 2]).replace(',', '.')), note: details.join(' • '), address, mapsLink, hasAddress: addressI >= 0 && Boolean(address), sheetRow, status:value(statusI), cxStatus:value(cxStatusI), active:value(activeI), locationType:value(find(['locationtype','типлокации'])), crewLead:value(find(['crewlead','руководительбригады'])), marketState:value(find(['marketcarrierstates','market','carrierstates','штат'])), custom:value(customI), project:value(projectI), start:value(startI), week:value(weekI) };
      }).filter(x => Number.isFinite(x.lat) && Number.isFinite(x.lng));
    }

    async function loadLocations() {
      if (CONFIG.sheetCsvUrl.includes('PASTE_SHEET_ID')) return fallbackLocations;
      const response = await fetch(CONFIG.sheetCsvUrl, { cache:'no-store' }); if (!response.ok) throw new Error('Не удалось загрузить таблицу');
      return fromRows(parseCsv(await response.text()));
    }

    const filterFields = [{key:'status', label:'Status'}, {key:'locationType', label:'Location Type'}, {key:'crewLead', label:'Crew Lead'}, {key:'marketState', label:'Market/Carrier States'}, {key:'custom', label:'Custom'}, {key:'project', label:'Project #'}];
    function setupFilters() {
      document.querySelector('#filters').innerHTML = filterFields.map(field => `<div class="filter-menu" data-menu="${field.key}"><button type="button" class="filter-button" data-filter-button="${field.key}">${field.label}</button><div class="filter-panel"><input class="filter-search" data-filter-search="${field.key}" placeholder="Поиск ${field.label}…">${[...new Set(locations.map(x => x[field.key]).filter(Boolean))].sort((a,b) => a.localeCompare(b)).map(value => `<label class="filter-option"><input type="checkbox" data-filter-value="${field.key}" value="${escapeHtml(value)}"><span>${escapeHtml(value)}</span></label>`).join('')}</div></div>`).join('') + '<div class="date-filter"><label for="startAfterDate">Start after</label><input id="startAfterDate" type="date"></div>';

      locations.forEach(location => { const option = document.createElement('option'); option.value = location.name; routeLocations.appendChild(option); });
      document.querySelector('#addRoutePoint').addEventListener('click', () => { const current = document.querySelectorAll('[data-route-point]').length; const row = document.createElement('div'); row.className = 'route-point-row'; row.innerHTML = `<input type="text" draggable="true" data-route-point="${current + 1}" list="routeLocations" placeholder="${current + 1}. Точка маршрута" autocomplete="off"><button type="button" class="remove-route-point" aria-label="Удалить точку">×</button>`; document.querySelector('#routePoints').insertBefore(row, document.querySelector('#addRoutePoint')); });
      document.querySelector('#routePoints').addEventListener('click', event => { if (event.target.matches('.clear-route-point')) { const input = event.target.closest('.route-point-row').querySelector('[data-route-point]'); input.value = ''; input.dispatchEvent(new Event('input', { bubbles:true })); return; } if (!event.target.matches('.remove-route-point')) return; event.target.closest('.route-point-row').remove(); [...document.querySelectorAll('[data-route-point]')].forEach((input, index) => { input.dataset.routePoint = index + 1; input.placeholder = `${index + 1}. Точка маршрута`; }); routeSelection = new Set([...document.querySelectorAll('[data-route-point]')].map(input => locations.findIndex(location => location.name === input.value.trim())).filter(index => index >= 0)); });
      document.querySelector('#showLabelsToggle').addEventListener('change', event => { locationLabels.setEnabled(event.target.checked); renderList(document.querySelector('#search').value); });
      document.querySelector('#activeLocationsToggle').addEventListener('change', event => { if (event.target.checked) document.querySelector('#showAllLocationsToggle').checked = false; renderList(document.querySelector('#search').value); });
      document.querySelector('#showAllLocationsToggle').addEventListener('change', event => { if (event.target.checked) document.querySelector('#activeLocationsToggle').checked = false; renderList(document.querySelector('#search').value); });
      const routePoints = document.querySelector('#routePoints');
      const highlightRouteInput = input => { const index = locations.findIndex(location => location.name === input.value.trim()); highlightedRouteIndex = index; routeSelection = new Set([...document.querySelectorAll('[data-route-point]')].map(routeInput => locations.findIndex(location => location.name === routeInput.value.trim())).filter(routeIndex => routeIndex >= 0)); renderList(document.querySelector('#search').value); };
      routePoints.addEventListener('input', event => { if (event.target.matches('[data-route-point]')) highlightRouteInput(event.target); });
      routePoints.addEventListener('focusin', event => { if (event.target.matches('[data-route-point]')) highlightRouteInput(event.target); });
      routePoints.addEventListener('click', event => { if (event.target.matches('[data-route-point]')) highlightRouteInput(event.target); });
      routePoints.addEventListener('dragstart', event => { if (event.target.matches('[data-route-point]')) { event.dataTransfer.setData('text/plain', event.target.dataset.routePoint); event.target.classList.add('dragging'); } });
      routePoints.addEventListener('dragend', event => event.target.classList.remove('dragging'));
      routePoints.addEventListener('dragover', event => { if (event.target.matches('[data-route-point]')) event.preventDefault(); });
      routePoints.addEventListener('drop', event => { const target = event.target.closest('[data-route-point]'); if (!target) return; event.preventDefault(); const source = [...routePoints.querySelectorAll('[data-route-point]')].find(input => input.dataset.routePoint === event.dataTransfer.getData('text/plain')); if (!source || source === target) return; const sourceValue = source.value; source.value = target.value; target.value = sourceValue; });
      document.querySelector('#openRoute').addEventListener('click', openRouteInGoogleMaps);
      document.querySelector('#buildRoute').addEventListener('click', buildRouteOnMap);
    }
    function renderList(query = '') {
      const selected = Object.fromEntries(filterFields.map(field => [field.key, [...document.querySelectorAll(`[data-filter-value="${field.key}"]:checked`)].map(input => input.value)]));
      const showAll = document.querySelector('#showAllLocationsToggle')?.checked ?? true;
      const activeOnly = document.querySelector('#activeLocationsToggle')?.checked ?? false;
      const hasSearchQuery = Boolean(query.trim());
      const startAfter = dateNumber(document.querySelector('#startAfterDate')?.value);
      const hasSelectedFilters = Object.values(selected).some(values => values.length > 0) || Boolean(startAfter);
      const displayLocations = showAll || activeOnly || hasSelectedFilters || routeSelection.size > 0;
      const matchesFilters = location => filterFields.every(field => !selected[field.key].length || selected[field.key].includes(location[field.key])) && (!startAfter || (dateNumber(location.start) && dateNumber(location.start) > startAfter));
      const filterMatches = locations.filter(matchesFilters);
      const searchResults = hasSearchQuery ? locations.filter(location => `${location.name} ${location.note}`.toLowerCase().includes(query.trim().toLowerCase())) : [];
      const searchMatches = searchResults.filter(matchesFilters);
      const activeMatches = locations.filter(location => location.active.replace(/\s+/g, ' ').toLowerCase().includes('active locations') && matchesFilters(location));
      const searchedLocation = searchResults.find(location => location.name.toLowerCase() === query.trim().toLowerCase()) || searchResults[0] || null;
      const filtered = activeOnly ? (hasSearchQuery && searchedLocation ? [searchedLocation] : activeMatches) : showAll || hasSelectedFilters ? (hasSearchQuery ? searchMatches : filterMatches) : [];
      const mapLocations = [...(activeOnly ? activeMatches : showAll || hasSelectedFilters ? filterMatches : []), ...searchResults];
      const visible = new Set([...mapLocations, ...(displayLocations ? [...routeSelection].map(index => locations[index]).filter(Boolean) : [])]);
      const searchedIndex = searchedLocation ? locations.indexOf(searchedLocation) : -1;
      markers.forEach((marker, index) => { const highlighted = index === searchedIndex || index === highlightedRouteIndex; marker.setVisible(visible.has(locations[index])); marker.setIcon(markerIcon(locations[index], highlighted)); marker.setZIndex(index === searchedIndex ? 100000 : undefined); });
      if (locationLabels) locationLabels.setVisibleIndexes([...visible].map(location => locations.indexOf(location)).filter(index => index >= 0));
      document.querySelector('#count').textContent = filtered.length; document.querySelector('#status').textContent = `${locations.length} ${locations.length === 1 ? 'локация' : 'локаций'}`;
      const list = document.querySelector('#places'); list.innerHTML = filtered.length ? filtered.map(x => `<article class="place" data-index="${locations.indexOf(x)}"><h2>${escapeHtml(x.name)}</h2><p>${x.address ? `<strong>Address:</strong> ${escapeHtml(x.address)}<br>` : ''}${x.marketState ? `<strong>Market/Carrier States:</strong> ${escapeHtml(x.marketState)}<br>` : ''}${x.cxStatus ? `<strong>CX Status:</strong> ${escapeHtml(x.cxStatus)}<br>` : ''}${x.status ? `<strong>Status:</strong> ${escapeHtml(x.status)}<br>` : ''}${x.crewLead ? `<strong>Crew Lead:</strong> ${escapeHtml(x.crewLead)}<br>` : ''}<a href="${escapeHtml(x.mapsLink)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">Открыть в Google Maps</a></p></article>`).join('') : '<div class="empty">Ничего не найдено.</div>';
      list.querySelectorAll('.place').forEach(el => el.addEventListener('click', () => focusLocation(Number(el.dataset.index))));
    }
    function escapeHtml(value) { return String(value).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c])); }
    function dateNumber(value) { const text = String(value || '').trim(); const match = text.match(/^(\d{4})-(\d{2})-(\d{2})$/) || text.match(/^(\d{1,2})[/.\-](\d{1,2})[/.\-](\d{4})$/); if (!match) return 0; const year = match.length === 4 && match[1].length === 4 ? Number(match[1]) : Number(match[3]); const month = match.length === 4 && match[1].length === 4 ? Number(match[2]) : Number(match[1]); const day = match.length === 4 && match[1].length === 4 ? Number(match[3]) : Number(match[2]); const timestamp = Date.UTC(year, month - 1, day); return Number.isNaN(timestamp) ? 0 : timestamp; }
    function markerIcon(location, highlighted = false) { const status = location.status.trim().toLowerCase(); const cxStatus = location.cxStatus.trim().toLowerCase(); const active = location.active.replace(/\s+/g, ' ').toLowerCase().includes('active locations'); const completed = status.includes('completed'); const isWh = location.locationType.toUpperCase() === 'WH'; const color = cxStatus.includes('not started') ? '#111827' : status && !completed ? '#f2b01e' : active && !isWh ? '#9bdc28' : isWh ? '#2563eb' : '#ef3f35'; return { path:'M0-48c-10 0-18 8-18 18 0 13 18 30 18 30s18-17 18-30c0-10-8-18-18-18z', fillColor:color, fillOpacity:1, strokeColor:'#ffffff', strokeWeight:2, scale:highlighted ? 1.2 : 0.75, anchor:new google.maps.Point(0,0) }; }
    function formatDuration(seconds) { const minutes = Math.max(1, Math.round(seconds / 60)); const hours = Math.floor(minutes / 60); return hours ? `${hours} h ${minutes % 60} min` : `${minutes} min`; }
    function openRouteInGoogleMaps() { const ids = [...document.querySelectorAll('[data-route-point]')].map(input => locations.findIndex(location => location.name === input.value.trim())).filter(index => index >= 0); if (ids.length < 2) { document.querySelector('#routeResult').textContent = 'Выберите минимум 2 точки.'; return; } const points = ids.map(index => `${locations[index].lat},${locations[index].lng}`); window.open(`https://www.google.com/maps/dir/${points.join('/')}`, '_blank'); }
    function buildRouteOnMap() { const routeResult = document.querySelector('#routeResult'); const ids = [...document.querySelectorAll('[data-route-point]')].map(input => locations.findIndex(location => location.name === input.value.trim())).filter(index => index >= 0); if (ids.length < 2) { routeResult.classList.remove('has-time'); routeResult.textContent = 'Выберите минимум 2 точки.'; return; } const point = index => ({ lat:locations[index].lat, lng:locations[index].lng }); directionsService.route({ origin:point(ids[0]), destination:point(ids.at(-1)), waypoints:ids.slice(1, -1).map(index => ({ location:point(index), stopover:true })), travelMode:google.maps.TravelMode.DRIVING, optimizeWaypoints:false }).then(result => { directionsRenderer.setDirections(result); const seconds = (result.routes[0]?.legs || []).reduce((total, leg) => total + (leg.duration?.value || 0), 0); routeResult.classList.add('has-time'); routeResult.innerHTML = `<span class="route-time-icon">🚗</span><span><small>DRIVING TIME</small><strong>${formatDuration(seconds)}</strong></span>`; }).catch(error => { console.error(error); routeResult.classList.remove('has-time'); routeResult.textContent = `Не удалось построить маршрут: ${error.message || error}`; }); }
    function focusLocation(index) { const x = locations[index]; infoWindow.setContent(`<div style="line-height:1.5"><strong>${escapeHtml(x.name)}</strong>${x.address ? `<br><b>Address:</b> ${escapeHtml(x.address)}` : ''}${x.marketState ? `<br><b>Market/Carrier States:</b> ${escapeHtml(x.marketState)}` : ''}${x.cxStatus ? `<br><b>CX Status:</b> ${escapeHtml(x.cxStatus)}` : ''}${x.status ? `<br><b>Status:</b> ${escapeHtml(x.status)}` : ''}${x.week ? `<br><b>Week:</b> ${escapeHtml(x.week)}` : ''}${x.crewLead ? `<br><b>Crew Lead:</b> ${escapeHtml(x.crewLead)}` : ''}<br><a href="${escapeHtml(x.mapsLink)}" target="_blank" rel="noopener">Открыть в Google Maps</a></div>`); infoWindow.open(map, markers[index]); document.querySelectorAll('.place').forEach(el => el.classList.toggle('active', Number(el.dataset.index) === index)); }
    function initMap() { map = new google.maps.Map(document.getElementById('map'), { center:{lat:55.751244,lng:37.618423}, zoom:5 }); infoWindow = new google.maps.InfoWindow(); directionsService = new google.maps.DirectionsService(); directionsRenderer = new google.maps.DirectionsRenderer({ map, suppressMarkers:false }); locationLabels = createLocationLabelsOverlay(map, locations); locations.forEach((x, i) => { const marker = new google.maps.Marker({ position:{lat:x.lat,lng:x.lng}, map, title:x.crewLead ? `${x.name} — ${x.crewLead}` : x.name, icon:markerIcon(x) }); marker.addListener('click', () => focusLocation(i)); markers.push(marker); }); if (locations.length) { const bounds = new google.maps.LatLngBounds(); locations.forEach(x => bounds.extend({lat:x.lat,lng:x.lng})); map.fitBounds(bounds); } setupFilters(); renderList(); }
    window.initMap = initMap;
    function renderSearchSuggestions(query) { const suggestions = document.querySelector('#searchSuggestions'); const value = query.trim().toLowerCase(); if (!value) { suggestions.innerHTML = ''; suggestions.classList.remove('visible'); return; } const matches = locations.filter(location => `${location.name} ${location.note}`.toLowerCase().includes(value)).slice(0, 8); suggestions.innerHTML = matches.map(location => `<div class="search-suggestion" data-suggestion="${escapeHtml(location.name)}">${escapeHtml(location.name)}</div>`).join(''); suggestions.classList.toggle('visible', matches.length > 0); }
    document.querySelector('#search').addEventListener('input', e => { renderSearchSuggestions(e.target.value); renderList(e.target.value); });
    document.querySelector('#findHotel').addEventListener('click', async () => { const query = document.querySelector('#search').value.trim().toLowerCase(); const location = locations.find(item => item.name.toLowerCase() === query) || locations.find(item => item.name.toLowerCase().includes(query)); if (!location) { document.querySelector('#status').textContent = 'Сначала выберите локацию в поиске'; return; } hotelMarkers.forEach(marker => marker.setMap(null)); hotelMarkers = []; document.querySelector('#status').textContent = 'Поиск отелей рядом…'; try { const { Place } = await google.maps.importLibrary('places'); const { places } = await Place.searchNearby({ fields:['displayName','location','formattedAddress','googleMapsURI','rating'], includedPrimaryTypes:['hotel'], maxResultCount:20, rankPreference:'DISTANCE', locationRestriction:{ center:{ lat:location.lat, lng:location.lng }, radius:10000 } }); places.forEach(place => { const marker = new google.maps.Marker({ map, position:place.location, title:place.displayName, icon:{ path:google.maps.SymbolPath.CIRCLE, scale:8, fillColor:'#7c3aed', fillOpacity:1, strokeColor:'#ffffff', strokeWeight:2 } }); marker.addListener('click', () => { const link = place.googleMapsURI ? `<br><a href="${escapeHtml(place.googleMapsURI)}" target="_blank" rel="noopener">Open in Google Maps</a>` : ''; infoWindow.setContent(`<strong>${escapeHtml(place.displayName || 'Hotel')}</strong>${place.formattedAddress ? `<br>${escapeHtml(place.formattedAddress)}` : ''}${place.rating ? `<br>Rating: ${place.rating}` : ''}${link}`); infoWindow.open(map, marker); }); hotelMarkers.push(marker); }); document.querySelector('#status').textContent = `${places.length} hotels found nearby`; } catch (error) { console.error(error); document.querySelector('#status').textContent = `Ошибка поиска отелей: ${error.message || 'неизвестная ошибка'}`; } });
    document.querySelector('#refreshLocations').addEventListener('click', event => { event.currentTarget.disabled = true; document.querySelector('#status').textContent = 'Обновляю данные из Google Sheets…'; window.location.reload(); });
    document.querySelector('#searchSuggestions').addEventListener('click', event => { const suggestion = event.target.closest('[data-suggestion]'); if (!suggestion) return; const search = document.querySelector('#search'); search.value = suggestion.dataset.suggestion; document.querySelector('#searchSuggestions').classList.remove('visible'); renderList(search.value); });
    window.gm_authFailure = () => { document.querySelector('#status').textContent = 'Google отклонил API key: включите Maps JavaScript API и проверьте ограничения ключа.'; };
    function loadMapsScript() {
      if (CONFIG.googleMapsApiKey.includes('PASTE_')) { document.querySelector('#status').textContent = 'Добавьте API-ключ'; return; }
      const script = document.createElement('script');
      script.src = `https://maps.googleapis.com/maps/api/js?key=${CONFIG.googleMapsApiKey}&callback=initMap`;
      script.async = true; script.defer = true;
      script.onerror = () => { document.querySelector('#status').textContent = 'Google Maps API не загрузился. Проверьте ключ и разрешённые API.'; };
      document.head.appendChild(script);
      setTimeout(() => { if (!map) document.querySelector('#status').textContent = 'Карта не запустилась. Проверьте Maps JavaScript API, billing и ограничения API key.'; }, 8000);
    }
    loadLocations().then(data => { locations = data; loadMapsScript(); }).catch(error => { locations = fallbackLocations; document.querySelector('#status').textContent = 'Таблица недоступна — показан пример'; renderList(); loadMapsScript(); });
  </script>
