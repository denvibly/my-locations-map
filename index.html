<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inteksolut Map</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="topbar__left">
        <button type="button" id="toggleSidebarBtn" class="icon-button" aria-label="Переключить панель">
          <span></span>
          <span></span>
          <span></span>
        </button>
        <div class="brand-mark">📍</div>
        <div class="brand-copy">
          <strong>Inteksolut Map</strong>
        </div>
      </div>
      <div class="topbar__center">All Projects</div>
      <div class="topbar__right">
        <button type="button" id="reloadBtn" class="reload-button" aria-label="Обновить данные">↻</button>
      </div>
    </header>

    <div class="workspace">
      <aside id="sidebar" class="sidebar">
        <div class="sidebar__section sidebar__section--tight">
          <label class="field">
            <span class="field__label">Поиск по названию</span>
            <input id="searchInput" type="search" placeholder="Search">
          </label>
        </div>

        <div class="sidebar__section">
          <label class="field">
            <span class="field__label">Status</span>
            <select id="statusFilter">
              <option value="">All</option>
            </select>
          </label>

          <label class="field">
            <span class="field__label">Location Type #</span>
            <select id="locationTypeNumberFilter">
              <option value="">All</option>
            </select>
          </label>

          <label class="field">
            <span class="field__label">Link</span>
            <select id="linkFilter">
              <option value="">All</option>
            </select>
          </label>

          <label class="field">
            <span class="field__label">Market/Carrier-States</span>
            <select id="marketCarrierStatesFilter">
              <option value="">All</option>
            </select>
          </label>

          <label class="field">
            <span class="field__label">Active</span>
            <select id="activeFilter">
              <option value="">All</option>
            </select>
          </label>

          <label class="field">
            <span class="field__label">Location Type</span>
            <select id="locationTypeFilter">
              <option value="">All</option>
            </select>
          </label>

          <label class="field">
            <span class="field__label">Crew Lead</span>
            <select id="crewLeadFilter">
              <option value="">All</option>
            </select>
          </label>

          <label class="field">
            <span class="field__label">Special</span>
            <select id="specialFilter">
              <option value="">All</option>
            </select>
          </label>
        </div>

        <div class="sidebar__section sidebar__section--compact">
          <button id="clearFiltersBtn" type="button" class="link-button">Clear</button>
          <div class="stats">
            <div><span>Всего</span><strong id="totalCount">0</strong></div>
            <div><span>На карте</span><strong id="visibleCount">0</strong></div>
          </div>
          <p id="status" class="status">Загрузка карты...</p>
        </div>
      </aside>

      <main class="map-stage">
        <div id="map" class="map"></div>
      </main>
    </div>
  </div>

  <script src="./app.js"></script>
</body>
</html>
