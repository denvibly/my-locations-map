      script.onerror = () => { document.querySelector('#status').textContent = 'Google Maps API не загрузился. Проверьте ключ и разрешённые API.'; };
      document.head.appendChild(script);
      setTimeout(() => { if (!map) document.querySelector('#status').textContent = 'Карта не запустилась. Проверьте Maps JavaScript API, billing и ограничения API key.'; }, 8000);
    }
    updateLegendShapes();
    applyLanguage();
    loadLocations().then(data => { locations = data; loadMapsScript(); }).catch(error => { locations = fallbackLocations; document.querySelector('#status').textContent = language === 'ru' ? 'Таблица недоступна — показан пример' : 'Sheet is unavailable — showing an example'; renderList(); loadMapsScript(); });
  </script>
</body>
</html>
